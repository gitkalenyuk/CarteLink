<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CarteLink — перемикач моделей</title>
<link rel="stylesheet" href="switcher.css?v=2.5.2">
<script src="i18n.js?v=2.5.2"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="s-swap" viewBox="0 0 24 24"><path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/></symbol>
  <symbol id="s-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="s-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></symbol>
</svg>

<div id="sw" class="sw">
  <div class="head">
    <span class="live" id="dot"></span>
    <span class="head-t">Активна модель</span>
    <span class="head-m" id="current">…</span>
  </div>

  <div class="slots">
    <div class="slot" id="slot1" data-to="1">
      <button class="num" data-to="1" title="Застосувати модель 1 до всього">1</button>
      <select id="m1" class="pick" aria-label="Модель 1"></select>
      <svg class="tick"><use href="#s-check"/></svg>
    </div>
    <div class="slot" id="slot2" data-to="2">
      <button class="num" data-to="2" title="Застосувати модель 2 до всього">2</button>
      <select id="m2" class="pick" aria-label="Модель 2"></select>
      <svg class="tick"><use href="#s-check"/></svg>
    </div>
  </div>

  <button id="swap" class="swap"><svg class="ico"><use href="#s-swap"/></svg><span>Перемкнути</span></button>

  <label class="auto" id="autoRow">
    <input type="checkbox" id="auto">
    <span class="track"><span class="knob"></span></span>
    <span class="auto-t">
      <b>Змінити модель після першого вдалого запиту до моделі 1</b>
      <i id="autoState">вимкнено</i>
    </span>
  </label>
</div>

<div id="locked" class="locked" style="display:none">
  <b>CarteLink</b>
  <span>Увійди через Telegram у головному вікні CarteLink.</span>
</div>
<script src="switcher.js?v=2.5.2"></script>
</body>
</html>
