<script>
// Theme and look before the first paint, so the window never flashes.
try {
  var p = JSON.parse(localStorage.getItem('cl.look') || '{}');
  if (p.theme && p.theme !== 'graphite') document.documentElement.setAttribute('data-theme', p.theme);
  if (p.vars) for (var k in p.vars) document.documentElement.style.setProperty(k, p.vars[k]);
} catch (e) {}
</script>

<!--
THESIS: CarteLink is a switchboard you arrange yourself. One shell, ten worlds (Graphite default, Datamatics, Departures, Aurora, Paper, Synthwave, Phosphor, Nord, Sunset, Swiss) plus a custom one; every block on every page can be moved, resized or hidden. Refuses a fixed one-look admin template.
OWN-WORLD: tokens only (app.css :root + themes.css); components never change per theme; world touches: Datamatics barcode field, Departures split-flap model, Aurora light, Synthwave horizon, Phosphor scanlines.
STORY: the user sees at once which model answers, whether accounts are alive, what traffic flows; switches the model in one click; cleans dead accounts in bulk; arranges the console their way.
FIRST VIEWPORT: Overview: now-model with switch and presets, gateway state with address and key, live request feed, account health, KPIs, activity chart.
FORM: user-chosen themes (Graphite, Datamatics + 8); seed key 14bfb66e.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
